[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geomind"
version = "0.1.0"
description = "Evidence-grounded geospatial intelligence research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "rasterio>=1.3.10,<2", "pyproj>=3.6,<4", "pydantic>=2.7,<3"]

[project.optional-dependencies]
catalog = ["pystac-client>=0.8,<2"]
app = ["streamlit>=1.36,<2", "folium>=0.17,<1", "streamlit-folium>=0.22,<1"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.5,<1", "streamlit>=1.36,<2", "folium>=0.17,<1", "streamlit-folium>=0.22,<1", "pystac-client>=0.8,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

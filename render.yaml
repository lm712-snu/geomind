services:
  - type: web
    name: geomind-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -e ".[api,catalog,vlm]"
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GEOMIND_CORS_ORIGINS
        value: https://lm712-snu.github.io,http://localhost:8000,http://127.0.0.1:8000
      - key: OPENAI_API_KEY
        sync: false
      - key: GEOMIND_VLM_MODEL
        value: gpt-4.1-mini
